name: test-setup-env

# Guards against the settings-merge corruption regression (issue #201).
on:
  pull_request:
    paths:
      - "setup-env.ps1"
      - "setup-env.sh"
      - "scripts/Merge-JsonObjects.ps1"
      - "scripts/test-merge-jsonobjects.ps1"
      - "scripts/test-setup-env-integration.ps1"
      - "scripts/merge_settings.py"
      - "scripts/test_merge_settings.py"
      - "scripts/sync-standards.sh"
      - "scripts/test_sync-standards.sh"
      - "scripts/Sync-TeamStandards.ps1"
      - "scripts/test-sync-teamstandards.ps1"
      - "scripts/diff-preview.awk"
      - "standards/CLAUDE.md"
      - "standards/settings.json"
      - ".github/workflows/test-setup-env.yml"
  push:
    branches: [main]

jobs:
  merge-test:
    # Run on Linux and macOS so the bash/python path is verified on both
    # (macOS ships bash 3.2 and no jq — the exact environment this fix targets).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge-JsonObjects unit test (pwsh)
        shell: pwsh
        run: ./scripts/test-merge-jsonobjects.ps1
      - name: Settings-sync integration test (pwsh)
        shell: pwsh
        run: ./scripts/test-setup-env-integration.ps1
      - name: merge_settings unit test (bash path, python)
        run: python3 scripts/test_merge_settings.py
      - name: setup-env.sh syntax check
        run: bash -n setup-env.sh
      - name: Team-standards splice test (bash)
        run: bash scripts/test_sync-standards.sh
      - name: Team-standards splice test (pwsh)
        shell: pwsh
        run: ./scripts/test-sync-teamstandards.ps1

  # Developers run setup-env.ps1 on native Windows, often under Windows
  # PowerShell 5.1, which the Linux/macOS pwsh runs above do not cover.
  windows-standards-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Team-standards splice test (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-sync-teamstandards.ps1
      - name: Team-standards splice test (Git Bash)
        shell: bash
        run: bash scripts/test_sync-standards.sh
