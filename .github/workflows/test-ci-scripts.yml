name: test-ci-scripts

# The ci plugin's script writes and rewrites workflow files in a repository. The smoke test runs it against a local fake ci-recipes, offline.
# macOS is in the matrix because it ships bash 3.2, the floor the script targets.
on:
  pull_request:
    paths:
      - "plugins/ci/**"
      - ".github/workflows/test-ci-scripts.yml"
  push:
    branches: [main]

jobs:
  ci-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in plugins/ci/scripts/*.sh; do bash -n "$f"; done
      - name: Smoke test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          bash plugins/ci/scripts/test_ci.sh
